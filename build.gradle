plugins {
    id 'application'
}

group = 'com.yettiesoft'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // HTML 템플릿 엔진. 화면은 src/main/resources/templates/*.html 에 둔다.
    implementation 'org.thymeleaf:thymeleaf:3.1.7.RELEASE'
    // Thymeleaf가 로그를 남길 때 쓰는 구현체(설정: src/main/resources/simplelogger.properties)
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.20'

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.yettiesoft.shop.ShopApplication'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}
