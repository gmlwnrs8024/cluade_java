<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('장바구니')}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<h1>장바구니</h1>
<ul th:replace="~{layout :: errors(${errors})}"></ul>

<th:block th:if="${cart.isEmpty()}">
  <p>장바구니가 비어 있습니다.</p>
  <p><a href="/products">상품 보러 가기</a></p>
</th:block>

<th:block th:unless="${cart.isEmpty()}">
  <table class="cart">
    <thead>
      <tr><th>상품</th><th>가격</th><th>수량</th><th>합계</th><th></th></tr>
    </thead>
    <tbody>
      <tr th:each="item : ${cart.items()}">
        <td><a th:href="|/products/${item.product().id()}|" th:text="${item.product().name()}">상품 이름</a></td>
        <td class="num" th:text="${#numbers.formatInteger(item.product().price(), 1, 'COMMA') + '원'}">0원</td>
        <td>
          <form method="post" action="/cart/update" class="inline">
            <input type="hidden" name="productId" th:value="${item.product().id()}">
            <input type="number" name="quantity" th:value="${item.quantity()}" min="0" max="99" class="qty">
            <button>변경</button>
          </form>
        </td>
        <td class="num price" th:text="${#numbers.formatInteger(item.subtotal(), 1, 'COMMA') + '원'}">0원</td>
        <td>
          <form method="post" action="/cart/remove" class="inline">
            <input type="hidden" name="productId" th:value="${item.product().id()}">
            <button>삭제</button>
          </form>
        </td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <th colspan="3">총 금액</th>
        <td class="num price" th:text="${#numbers.formatInteger(cart.totalPrice(), 1, 'COMMA') + '원'}">0원</td>
        <td></td>
      </tr>
    </tfoot>
  </table>
  <p><a href="/products">쇼핑 계속하기</a></p>
</th:block>
</body>
</html>
